<style>

  }
}

// ---------- Estado persistente ----------
const KEY = 'dpp-quiz-v1';

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); S.settings = Object.assign(fresh().settings, S.settings); } catch (e) {}

applyTheme();

// ---------- Rangos ----------
const RANKS = [
  [0, 'Estudiante de primero'], [400, 'Becario/a de despacho'], [1200, 'Pasante'], [2500, 'Letrado/a'],
  [4500, 'Notario/a'], [7000, 'Registrador/a de la Propiedad'], [10000, 'Magistrado/a'], [14000, 'Catedrático/a']
];
const rankOf = xp => { let i = 0; RANKS.forEach((r, k) => { if (xp >= r[0]) i = k; }); const next = RANKS[i + 1]; return { name: RANKS[i][1], i, from: RANKS[i][0], to: next ? next[0] : null, nextName: next ? next[1] : null }; };

// ---------- Racha diaria ----------
const fmtDay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  const ys = fmtDay(y);
  S.day.streak = S.day.last === ys ? S.day.streak + 1 : 1; S.day.last = t;
};
const dayStreak = () => { const y = new Date(); y.setDate(y.getDate() - 1); return (S.day.last === today() || S.day.last === fmtDay(y)) ? S.day.streak : 0; };

let actx = null;
const beep = (freqs, dur = .09) => {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); t += dur * .9; });
  } catch (e) {}
};
const sOk = () => beep([660, 880]); const sKo = () => beep([220, 165], .14); const sWin = () => beep([523, 659, 784, 1047], .11);

// ---------- Confeti ----------
const fx = $('#fx'); const ctx = fx.getContext('2d'); let parts = [], raf = 0;
const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const confetti = (n = 120) => {
  if (reduced()) return;
  fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const cs = getComputedStyle(document.documentElement); const cols = ['--accent', '--brass', '--ok', '--bad'].map(v => cs.getPropertyValue(v).trim());
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: Math.random() * -11 - 3, r: Math.random() * 6 + 3, c: cols[i % cols.length], a: Math.random() * 6, life: 0 });
  if (!raf) loop();
};
const loop = () => { ctx.clearRect(0, 0, innerWidth, innerHeight); parts.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.a += .2; p.life++; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }); parts = parts.filter(p => p.y < innerHeight + 20 && p.life < 240); raf = parts.length ? requestAnimationFrame(loop) : (ctx.clearRect(0, 0, innerWidth, innerHeight), 0); };

    </div>
    <div class="panel"><h2>Acierto por tema</h2>
      ${rows.map(({ t, s, p }) => `<div class="trow ${s.a && p < 60 ? 'weak' : ''}"><span>Tema ${t.num} · ${esc(t.titulo)}</span><div class="bar"><i style="width:${p}%"></i></div><em>${s.a ? p + '%' : '—'}</em></div>`).join('')}
      <p class="note">Por debajo del 60 % el tema se marca en rojo: es buen candidato para repasar.</p>
    </div>
    <div class="sec-h"><h2>Logros</h2><span>${Object.keys(S.ach).length}/${ACH.length}</span></div>
    <div class="ach">${ACH.map(a => `<div class="badge ${S.ach[a.id] ? 'got' : ''}"><i>${I.medal}</i><div><b>${esc(a.n)}</b><span>${esc(a.d)}</span></div></div>`).join('')}</div>
  </div>`;
};

let confirmReset = false;
V.settings = () => {
  const st = S.settings;
  on('.back', () => { confirmReset = false; go('home'); });
  on('[data-sw]', el => { const k = el.dataset.sw; st[k] = !st[k]; save(); render(); });
  on('[data-th]', el => { st.theme = el.dataset.th; save(); applyTheme(); render(); });
  on('#reset', () => { if (!confirmReset) { confirmReset = true; render(); return; } const keep = S.settings; S = fresh(); S.settings = keep; confirmReset = false; save(); toast(I.check + '<span>Progreso borrado</span>'); go('home'); });
  on('#cancelReset', () => { confirmReset = false; render(); });
  const sw = (k, label, desc) => `<div class="set"><div><b>${label}</b><span>${desc}</span></div><button class="switch" role="switch" aria-checked="${!!st[k]}" aria-label="${label}" data-sw="${k}"></button></div>`;
  return `
  <button class="back">${I.left} Inicio</button>
  <div class="page">
    <div><span class="eyebrow">Ajustes</span><h1>Cómo quieres jugar</h1></div>
    <div class="panel">
      ${sw('timer', 'Modo contrarreloj', '20 segundos por pregunta. Lo que sobra suma puntos extra.')}
      ${sw('sound', 'Sonidos', 'Tonos breves al acertar, fallar y terminar.')}
      ${sw('unlockAll', 'Desbloquear todo', 'Juega cualquier nivel o examen sin aprobar los anteriores.')}
      <div class="set"><div><b>Apariencia</b><span>Claro, oscuro o según tu dispositivo.</span></div>
        <div class="seg">${[['system', 'Auto'], ['light', 'Claro'], ['dark', 'Oscuro']].map(([v, l]) => `<button data-th="${v}" aria-pressed="${st.theme === v}">${l}</button>`).join('')}</div></div>
    </div>
    <div class="panel"><h2>Datos</h2>
      <p class="note">El progreso se guarda solo en este navegador. Si borras los datos del sitio o usas otro dispositivo, empezarás de cero.</p>
      <div class="row">${confirmReset ? '<button class="btn danger" id="reset">Sí, borrar todo</button><button class="btn" id="cancelReset">Cancelar</button>' : '<button class="btn danger" id="reset">Borrar progreso</button>'}</div>
    </div>
  </div>`;
};

// ---------- Juego ----------
let G = null, tick = 0;
const TIME_Q = 20, BLITZ_T = 60;
const stopTimers = () => { clearInterval(tick); tick = 0; };
const mkItem = id => { const b = BANK[id]; const opts = shuffle([b.right, ...b.wrong]); return { id, q: b.q, opts, correct: opts.indexOf(b.right), e: b.e, tema: b.tema, lvl: b.lvl }; };
const startGame = (cfg) => {
  stopTimers();
  let ids = [], title = '';
  const all = Object.keys(BANK);
  if (cfg.mode === 'level') { const t = temaById(cfg.tema); ids = shuffle(t.niveles[cfg.lvl].q.map((_, i) => t.id + '-' + cfg.lvl + '-' + i)); title = 'Tema ' + t.num + ' · Nivel ' + (cfg.lvl + 1); }
  else if (cfg.mode === 'exam') { const t = temaById(cfg.tema); ids = shuffle(all.filter(id => BANK[id].tema === t.id)).slice(0, 30); title = 'Examen · Tema ' + t.num; }
  else if (cfg.mode === 'global') { // reparto equilibrado entre temas
    const per = TEMAS.map(t => shuffle(all.filter(id => BANK[id].tema === t.id)));
    let k = 0; while (ids.length < 30) { const p = per[k % per.length]; if (p.length) ids.push(p.pop()); k++; }
    ids = shuffle(ids); title = 'Examen global';
  }
  else if (cfg.mode === 'review') { ids = shuffle(failIds(cfg.tema)).slice(0, 30); title = cfg.tema ? 'Repaso de fallos · Tema ' + temaById(cfg.tema).num : 'Repaso de fallos'; }
  else if (cfg.mode === 'blitz') { ids = shuffle(all); title = 'Desafío relámpago'; }
  if (!ids.length) { toast(I.check + '<span>No quedan preguntas pendientes aquí</span>'); go(cfg.tema ? 'tema' : 'home', cfg.tema); return; }
  touchDay();
  G = { ...cfg, title, items: ids.map(mkItem), i: 0, score: 0, streak: 0, bestStreak: 0, ok: 0, marks: [], wrongs: [], life: { fifty: 1, skip: 1 }, usedLife: false, answered: false, gone: [], tLeft: TIME_Q, blitzLeft: BLITZ_T, startXp: S.xp };
  view = 'game';
  if (cfg.mode === 'blitz') { tick = setInterval(() => { G.blitzLeft--; const c = $('#blitzClock'); if (c) c.textContent = G.blitzLeft; if (G.blitzLeft <= 0) { stopTimers(); finish(); } }, 1000); }
  drawQ();
};
const mult = s => s >= 10 ? 3 : s >= 6 ? 2 : s >= 3 ? 1.5 : 1;
const startQTimer = () => {
  stopTimers(); if (!S.settings.timer || G.mode === 'blitz') return;
  G.tLeft = TIME_Q; const t0 = Date.now();
  tick = setInterval(() => {
    const left = Math.max(0, TIME_Q - (Date.now() - t0) / 1000); G.tLeft = left;
    const bar = $('#tbar'); if (bar) { bar.firstElementChild.style.width = (left / TIME_Q * 100) + '%'; bar.classList.toggle('warn', left < 6); }
    if (left <= 0) { stopTimers(); answer(-1); }
  }, 100);
};
const drawQ = () => {
  header();
  const it = G.items[G.i]; const total = G.mode === 'blitz' ? null : G.items.length; const m = mult(G.streak);
  const t = temaById(it.tema);
  const marks = total ? Array.from({ length: total }, (_, k) => `<i class="${G.marks[k] === 1 ? 'ok' : G.marks[k] === 0 ? 'ko' : k === G.i ? 'cur' : ''}"></i>`).join('') : '';
  app.innerHTML = `<div class="game">
    <div class="hud">
      <button class="btn ghost quit" id="quit">${I.left} Salir</button>
      ${G.mode === 'blitz' ? `<span class="chip"><span class="ico">${I.check}</span>${G.ok}</span>` : `<span class="chip">${G.i + 1}/${total}</span>`}
      <span class="chip brass">${G.score} pts</span>
      <span class="chip mult ${m > 1 ? 'hot' : ''}" title="Multiplicador por racha"><span class="ico">${I.flame}</span>x${m} · ${G.streak}</span>
    </div>
    ${G.mode === 'blitz' ? `<div class="blitz-clock" id="blitzClock" aria-live="polite">${G.blitzLeft}</div>` : `<div class="progress" aria-hidden="true">${marks}</div>`}
    ${S.settings.timer && G.mode !== 'blitz' ? '<div class="timer" id="tbar"><i style="width:100%"></i></div>' : ''}
    <div class="qcard fade">
      <div class="qmeta"><span>${esc(G.title)}</span><span>${G.mode === 'level' ? 'Pregunta ' + (G.i + 1) : 'Tema ' + t.num + ' · Nv. ' + (it.lvl + 1)}</span></div>
      <div class="qtext">${esc(it.q)}</div>
      <div class="opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      ${G.mode === 'blitz' ? '' : `<div class="life">
        <button class="btn" id="l50" ${G.life.fifty ? '' : 'disabled'}>${I.half} 50/50</button>
        <button class="btn" id="lskip" ${G.life.skip ? '' : 'disabled'}>${I.skip} Cambiar pregunta</button>
      </div>`}
      <div id="fbox"></div>
    </div>
    ${G.mode === 'blitz' ? '' : '<p class="kbd">Atajos: teclas 1–4 o A–D para responder · Intro para continuar</p>'}
  </div>`;
  G.answered = false; G.gone = [];
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  $('#quit').onclick = () => { stopTimers(); const back = G.tema ? ['tema', G.tema] : ['home']; G = null; go(...back); };
  const f = $('#l50'); if (f) f.onclick = fifty;
  const s = $('#lskip'); if (s) s.onclick = skipQ;
  startQTimer();
};
const fifty = () => {
  if (!G.life.fifty || G.answered) return; G.life.fifty = 0; G.usedLife = true;
  const it = G.items[G.i]; const wrong = shuffle(it.opts.map((_, k) => k).filter(k => k !== it.correct)).slice(0, 2); G.gone = wrong;
  wrong.forEach(k => { const b = document.querySelector('.opt[data-k="' + k + '"]'); b.classList.add('gone'); b.disabled = true; });
  $('#l50').disabled = true;
};
const skipQ = () => {
  if (!G.life.skip || G.answered) return; G.life.skip = 0; G.usedLife = true;
  const used = new Set(G.items.map(x => x.id));
  let pool = Object.keys(BANK).filter(id => !used.has(id) && (G.mode === 'level' ? (BANK[id].tema === G.tema && BANK[id].lvl === G.lvl) : G.tema ? BANK[id].tema === G.tema : true));
  if (!pool.length) pool = Object.keys(BANK).filter(id => !used.has(id) && (!G.tema || BANK[id].tema === G.tema));
  if (!pool.length) { toast('<span>No quedan preguntas para cambiar</span>'); return; }
  G.items[G.i] = mkItem(shuffle(pool)[0]); drawQ();
};
const answer = (k) => {
  if (G.answered) return; G.answered = true; stopTimers();
  const it = G.items[G.i]; const right = k === it.correct;
  const st = S.stats[it.tema] || (S.stats[it.tema] = { a: 0, c: 0 }); st.a++; S.answered++;
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; const kk = +b.dataset.k; if (kk === it.correct) b.classList.add('right'); else if (kk === k) b.classList.add('wrong'); });
  document.querySelectorAll('.life .btn').forEach(b => b.disabled = true);
  let gained = 0;
  if (right) {
    st.c++; S.correct++; G.ok++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); S.bestStreak = Math.max(S.bestStreak || 0, G.streak);
    gained = Math.round(100 * mult(G.streak) + (S.settings.timer && G.mode !== 'blitz' ? Math.round(G.tLeft) * 5 : 0));
    G.score += gained; G.marks[G.i] = 1; sOk();
    if (S.fails[it.id]) { delete S.fails[it.id]; if (G.mode === 'review') S.fixed++; }
    const fl = document.createElement('div'); fl.className = 'float'; fl.textContent = '+' + gained; document.body.appendChild(fl); setTimeout(() => fl.remove(), 900);
  } else {
    G.streak = 0; G.marks[G.i] = 0; G.wrongs.push({ it, k }); S.fails[it.id] = (S.fails[it.id] || 0) + 1; sKo();
  }
  save();
  if (G.mode === 'blitz') { setTimeout(() => { if (!G || G.blitzLeft <= 0) return; G.i++; if (G.i >= G.items.length) { stopTimers(); finish(); } else drawQ(); }, right ? 350 : 1100); return; }
  const last = G.i === G.items.length - 1;
  $('#fbox').innerHTML = `<div class="fb ${right ? 'ok' : 'ko'}" aria-live="polite">
      <b>${right ? (G.streak >= 3 ? '¡Correcto! Racha de ' + G.streak : '¡Correcto!') : (k === -1 ? 'Se acabó el tiempo' : 'No es correcto')}</b>
      ${right ? '' : '<p><strong>Respuesta correcta:</strong> ' + esc(it.opts[it.correct]) + '</p>'}
      <p>${esc(it.e)}</p></div>
    <div class="next-row" style="margin-top:12px"><button class="btn primary lg" id="next">${last ? 'Ver resultado' : 'Siguiente'} ${I.chev}</button></div>`;
  $('#next').onclick = nextQ; $('#next').focus({ preventScroll: true });
};
const nextQ = () => { if (!G || !G.answered) return; if (G.i >= G.items.length - 1) finish(); else { G.i++; drawQ(); } };

const finish = () => {
  stopTimers();
  const g = G; const n = g.mode === 'blitz' ? g.i + (g.answered ? 1 : 0) : g.items.length;
  const pct = n ? g.ok / n : 0;
  const stars = g.mode === 'blitz' ? 0 : pct >= .9 ? 3 : pct >= .75 ? 2 : pct >= .5 ? 1 : 0;
  const xp = Math.round(g.score / 10) + (stars ? stars * 15 : 0);
  S.xp += xp; S.games++;
  let unlocked = null, newBest = false;
  if (g.mode === 'level') {
    const key = lvKey(g.tema, g.lvl); const d = S.levels[key] || { best: 0, stars: 0, plays: 0 };
    const wasPassed = d.stars > 0; newBest = g.ok > d.best && d.plays > 0;
    d.best = Math.max(d.best, g.ok); d.stars = Math.max(d.stars, stars); d.plays++; S.levels[key] = d;
    const t = temaById(g.tema);
    if (!wasPassed && stars > 0 && g.lvl + 1 < t.niveles.length) unlocked = 'Has desbloqueado el nivel ' + (g.lvl + 2) + ': ' + t.niveles[g.lvl + 1].t;
    if (!wasPassed && stars > 0 && g.lvl + 1 === t.niveles.length) unlocked = 'Has desbloqueado el examen del Tema ' + t.num;
    if (g.ok === 30) S.perfects++;
    if (stars > 0 && !g.usedLife) S.noLifePass = true;
  }
  if (g.mode === 'exam' || g.mode === 'global') S.bestExam = Math.max(S.bestExam || 0, Math.round(pct * 100));
  if (g.mode === 'blitz') { newBest = g.ok > S.blitzBest; S.blitzBest = Math.max(S.blitzBest, g.ok); }
  const ach = checkAch(); save();
  G = null; view = 'result';
  const grade = (pct * 10).toFixed(1).replace('.', ',');
  const title = g.mode === 'blitz' ? (g.ok + ' aciertos en 60 segundos') : stars === 3 ? '¡Sobresaliente!' : stars === 2 ? '¡Notable!' : stars === 1 ? 'Aprobado' : 'Suspenso, pero se aprende';
  header();
  app.innerHTML = `<div class="result fade">
    <div class="res-card">
      <span class="eyebrow">${esc(g.title)}</span>
      ${g.mode === 'blitz' ? `<div class="rank-badge">${I.bolt}</div>` : starRow(stars)}
      <div class="res-title">${title}</div>
      ${g.mode === 'blitz' ? `<p class="note">${newBest ? '¡Nuevo récord!' : 'Récord actual: ' + S.blitzBest}</p>` : `<p class="note">Nota equivalente: <b>${grade}</b> sobre 10${newBest ? ' · ¡nueva mejor marca!' : ''}</p>`}
      <div class="res-grid">
        <div><b>${g.ok}/${n}</b><span>Aciertos</span></div>
        <div><b>${g.score}</b><span>Puntos</span></div>
        <div><b>${g.bestStreak}</b><span>Mejor racha</span></div>
        <div><b>+${xp}</b><span>XP ganada</span></div>
      </div>
      ${unlocked ? `<div class="unlock">${I.trophy}<span>${esc(unlocked)}</span></div>` : ''}
      ${g.mode === 'level' && stars === 0 ? '<p class="note">Necesitas 15 aciertos para aprobar y desbloquear el siguiente nivel.</p>' : ''}
      <div class="row" style="justify-content:center">
        <button class="btn primary lg" id="rAgain">${I.redo} Repetir</button>
        ${g.mode === 'level' && stars > 0 && g.lvl + 1 < temaById(g.tema).niveles.length ? '<button class="btn lg" id="rNext">Siguiente nivel ' + I.chev + '</button>' : ''}
        <button class="btn lg ghost" id="rBack">${g.tema ? 'Volver al tema' : 'Inicio'}</button>
      </div>
    </div>
    ${g.wrongs.length ? `<div class="sec-h"><h2>Repasa tus fallos</h2><span>${g.wrongs.length} ${g.wrongs.length === 1 ? 'pregunta' : 'preguntas'}</span></div>
    <div class="review">${g.wrongs.map(({ it, k }) => `<div class="rv"><b>${esc(it.q)}</b>
      <span class="yours">${k === -1 ? 'Sin responder' : 'Tu respuesta: ' + esc(it.opts[k])}</span>
      <span class="good">Correcta: ${esc(it.opts[it.correct])}</span><span class="why">${esc(it.e)}</span></div>`).join('')}</div>` : ''}
  </div>`;
  window.scrollTo(0, 0);
  $('#rAgain').onclick = () => startGame({ mode: g.mode, tema: g.tema, lvl: g.lvl });
  const nx = $('#rNext'); if (nx) nx.onclick = () => startGame({ mode: 'level', tema: g.tema, lvl: g.lvl + 1 });
  $('#rBack').onclick = () => g.tema ? go('tema', g.tema) : go('home');
  if (stars === 3 || (g.mode === 'blitz' && newBest && g.ok > 0)) { confetti(); sWin(); } else if (stars > 0) sWin();
  announceAch(ach);
  if (ach.length && stars < 3) confetti(60);
};

// ---------- Teclado ----------
document.addEventListener('keydown', e => {
  if (view !== 'game' || !G || e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
  const k = map[e.key.toLowerCase()];
  if (k !== undefined && !G.answered && !G.gone.includes(k)) { e.preventDefault(); answer(k); }
  else if (e.key === 'Enter' && G.answered && G.mode !== 'blitz') { e.preventDefault(); nextQ(); }
});

render();
})();
</script>
