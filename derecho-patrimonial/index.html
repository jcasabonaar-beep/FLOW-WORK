<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Test de Derecho Patrimonial</title>
<meta name="description" content="Juego de preguntas tipo test por temas y niveles para repasar Derecho Privado Patrimonial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: columna de juego de máx. 720px, estética de pegatinas (bordes gruesos + sombra desplazada) y un color propio por tema. */
:root {
  --bg: #eceffd;
  --dots: #d4d9f5;
  --surface: #ffffff;
  --surface-2: #f4f5fd;
  --ink: #14131c;
  --muted: #5c5b72;
  --edge: #14131c;
  --shade: #14131c;
  --primary: #3b5bff;
  --on-primary: #ffffff;
  --ok: #18b663;
  --ok-soft: #d9f7e6;
  --bad: #ff4b55;
  --bad-soft: #ffe1e3;
  --gold: #ffc531;
  --on-color: #14131c;
  --c-t1: #ffd23f;
  --c-t2: #ff8fc2;
  --c-t3: #53d9c8;
  --c-t4: #a98bff;
  --c-t8: #ff9b54;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --bw: 2.5px;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111019; --dots: #1d1c2b; --surface: #1c1b29; --surface-2: #252435; --ink: #f1f0fa; --muted: #a6a4c0;
    --edge: #3d3b57; --shade: #000000; --primary: #6f86ff; --on-primary: #0d0c16; --ok: #36d27f; --ok-soft: #12301f;
    --bad: #ff6b73; --bad-soft: #3a1619; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111019; --dots: #1d1c2b; --surface: #1c1b29; --surface-2: #252435; --ink: #f1f0fa; --muted: #a6a4c0;
  --edge: #3d3b57; --shade: #000000; --primary: #6f86ff; --on-primary: #0d0c16; --ok: #36d27f; --ok-soft: #12301f;
  --bad: #ff6b73; --bad-soft: #3a1619; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background-color: var(--bg); background-image: radial-gradient(var(--dots) 1.2px, transparent 1.2px); background-size: 22px 22px; color: var(--ink); font: 500 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 120px; }
.stk { background: var(--surface); border: var(--bw) solid var(--edge); border-radius: var(--r); box-shadow: 4px 4px 0 var(--shade); }
.press { transition: transform .08s, box-shadow .08s; }
.press:hover:not([disabled]) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--shade); }
.press:active:not([disabled]) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shade); }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: var(--bw) solid var(--edge); }
.top-in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; min-width: 0; }
.brand .logo { width: 40px; height: 40px; flex: none; }
.brand b { font: 800 15px/1 var(--f-display); letter-spacing: -.02em; white-space: nowrap; }
.brand b i { font-style: normal; color: var(--primary); }
.pills { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: var(--bw) solid var(--edge); font: 600 13px/1 var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill svg { width: 16px; height: 16px; flex: none; }
.pill.xp svg { color: var(--gold); }
.pill.fire svg { color: #ff6a2b; }
.sq { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); border: var(--bw) solid var(--edge); padding: 0; flex: none; }
.sq svg { width: 19px; height: 19px; }
@media (max-width: 480px) { .brand b { display: none; } }

/* Inicio */
.hello { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding-block: 22px 8px; }
.hello .mascot { width: 84px; height: 84px; }
.bubble { position: relative; padding: 14px 16px; }
.bubble::before { content: ""; position: absolute; left: -11px; top: 26px; width: 16px; height: 16px; background: var(--surface); border-left: var(--bw) solid var(--edge); border-bottom: var(--bw) solid var(--edge); transform: rotate(45deg); }
.bubble h1 { font-size: clamp(18px, 4.6vw, 25px); font-weight: 800; }
.bubble p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.cards2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; margin-top: 16px; }
@media (max-width: 560px) { .cards2 { grid-template-columns: 1fr; } }
.rankc { padding: 14px 16px; display: grid; gap: 6px; }
.lbl { font: 600 11px/1.3 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.rankc b { font: 800 18px/1.2 var(--f-display); }
.track { height: 14px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--edge); overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--gold); transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
.tiny { font-size: 12px; color: var(--muted); }
.goal { padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.ring { width: 62px; height: 62px; }
.goal b { font: 800 16px/1.2 var(--f-display); display: block; margin-block: 4px; }

.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-block: 16px 26px; }
@media (max-width: 600px) { .modes { grid-template-columns: repeat(2, 1fr); } }
.mode { padding: 12px; text-align: left; display: grid; gap: 4px; align-content: start; min-width: 0; }
.mode .ic { width: 38px; height: 38px; border-radius: 11px; border: 2px solid var(--edge); display: grid; place-items: center; margin-bottom: 4px; color: var(--on-color); }
.mode .ic svg { width: 20px; height: 20px; }
.mode b { font: 800 13px/1.2 var(--f-display); }
.mode span { font-size: 12px; color: var(--muted); line-height: 1.3; }
.mode[disabled] { opacity: .5; cursor: not-allowed; }

.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-block: 6px 12px; }
.sec h2 { font-size: 20px; }
.sec span { font-size: 13px; color: var(--muted); }
.temas { display: grid; gap: 14px; }
.tema { display: grid; grid-template-columns: 76px 1fr; padding: 0; text-align: left; overflow: hidden; width: 100%; }
.tema .num { background: var(--tc); color: var(--on-color); border-right: var(--bw) solid var(--edge); display: grid; place-items: center; align-content: center; gap: 2px; }
.tema .num small { font: 600 10px/1 var(--f-mono); letter-spacing: .12em; }
.tema .num strong { font: 800 34px/1 var(--f-display); }
.tema .body { padding: 14px 16px; min-width: 0; display: grid; gap: 6px; }
.tema h3 { font-size: 16px; }
.tema p { margin: 0; font-size: 13px; color: var(--muted); }
.tema .meta { display: flex; gap: 10px; align-items: center; font: 600 12px/1 var(--f-mono); color: var(--muted); }
.tema .meta .track { flex: 1; height: 10px; }
.tema .meta .track > i { background: var(--tc); }
.stars { display: inline-flex; gap: 1px; vertical-align: middle; }
.stars svg { width: 15px; height: 15px; }
.stars .on { color: var(--gold); }
.stars .off { color: var(--surface-2); }

/* Vista de tema */
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted); padding: 16px 0 8px; font-weight: 700; font-size: 14px; }
.back svg { width: 16px; height: 16px; }
.banner { background: var(--tc); color: var(--on-color); padding: 18px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.banner .lbl { color: var(--on-color); opacity: .75; }
.banner h1 { font-size: clamp(21px, 5vw, 30px); font-weight: 800; margin-top: 6px; }
.banner p { margin: 6px 0 0; font-size: 14px; opacity: .85; }
.banner .mascot { width: 76px; height: 76px; }
@media (max-width: 480px) { .banner .mascot { display: none; } .banner { grid-template-columns: 1fr; } }
.tabs { display: flex; gap: 8px; margin-block: 18px 6px; }
.tab { padding: 8px 16px; border-radius: 999px; border: var(--bw) solid var(--edge); background: var(--surface); font-weight: 800; font-size: 14px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.path { position: relative; display: grid; gap: 30px; padding-block: 34px 8px; }
.path::before { content: ""; position: absolute; left: 50%; top: 40px; bottom: 40px; border-left: 4px dashed var(--edge); opacity: .4; transform: translateX(-2px); }
.node-row { position: relative; display: flex; justify-content: center; }
.node-row:nth-child(4n+2) { transform: translateX(-24%); }
.node-row:nth-child(4n+4) { transform: translateX(24%); }
.node { width: 84px; height: 84px; border-radius: 50%; border: var(--bw) solid var(--edge); background: var(--tc); color: var(--on-color); display: grid; place-items: center; font: 800 28px/1 var(--f-display); box-shadow: 0 6px 0 var(--shade); position: relative; padding: 0; }
.node:active:not(.locked) { transform: translateY(5px); box-shadow: 0 1px 0 var(--shade); }
.node.locked { background: var(--surface-2); color: var(--muted); }
.node svg { width: 30px; height: 30px; }
.node.done::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--gold); }
.node.next { animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.node-lbl { position: absolute; top: 50%; transform: translateY(-50%); left: calc(50% + 56px); width: min(200px, 34vw); text-align: left; font-size: 13px; line-height: 1.3; }
.node-row:nth-child(4n+4) .node-lbl { left: auto; right: calc(50% + 56px); text-align: right; }
.node-lbl b { display: block; font-weight: 800; }
.node-lbl .stars svg { width: 13px; height: 13px; }
.start-tag { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font: 800 10px/1 var(--f-display); padding: 6px 8px; border-radius: 8px; white-space: nowrap; letter-spacing: .04em; }
@media (max-width: 480px) {
  .node-row:nth-child(4n+2) { transform: translateX(-17%); } .node-row:nth-child(4n+4) { transform: translateX(17%); }
  .node { width: 70px; height: 70px; font-size: 22px; } .node-lbl { left: calc(50% + 46px); } .node-row:nth-child(4n+4) .node-lbl { right: calc(50% + 46px); }
}
.extras { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; }
@media (max-width: 520px) { .extras { grid-template-columns: 1fr; } }
.extra { padding: 14px; display: grid; gap: 10px; }
.extra b { font: 800 15px/1.2 var(--f-display); }
.extra p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 11px 16px; border: var(--bw) solid var(--edge); background: var(--surface); font-weight: 800; font-size: 15px; box-shadow: 3px 3px 0 var(--shade); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.go { background: var(--ok); color: #0b2416; }
.btn.danger { background: var(--bad); color: #2b0507; }
.btn.lg { padding: 14px 22px; font-size: 16px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Apuntes */
.notes { display: grid; gap: 12px; margin-top: 8px; text-align: left; }
.note-card { padding: 0; overflow: hidden; }
.note-card summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center; font: 800 14px/1.3 var(--f-display); }
.note-card summary::-webkit-details-marker { display: none; }
.note-card summary svg { width: 18px; height: 18px; transition: transform .2s; flex: none; }
.note-card[open] summary svg { transform: rotate(90deg); }
.note-body { padding: 0 16px 16px; display: grid; gap: 10px; }
.note-body ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
.truco { background: var(--gold); color: var(--on-color); border: 2px solid var(--edge); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; display: flex; gap: 10px; align-items: flex-start; }
.truco svg { width: 18px; height: 18px; flex: none; margin-top: 2px; }

/* Juego */
.game { padding-top: 14px; display: grid; gap: 14px; }
.hud { display: flex; align-items: center; gap: 10px; }
.prog { flex: 1; height: 18px; border-radius: 99px; border: var(--bw) solid var(--edge); background: var(--surface); overflow: hidden; position: relative; }
.prog > i { position: absolute; inset: 0 auto 0 0; background: var(--ok); transition: width .4s cubic-bezier(.2,.9,.3,1.2); }
.prog > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.45); }
.pill.combo { background: var(--gold); color: var(--on-color); }
.pill.combo.hot { animation: pulse .8s infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.timer { height: 8px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--edge); overflow: hidden; }
.timer > i { display: block; height: 100%; background: var(--primary); }
.timer.warn > i { background: var(--bad); }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 2px solid var(--edge); background: var(--tc); color: var(--on-color); font: 600 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.tag.retry { background: var(--bad); color: #2b0507; }
.qtext { font: 800 clamp(19px, 4.4vw, 25px)/1.28 var(--f-display); letter-spacing: -.02em; text-wrap: pretty; padding-block: 4px 2px; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 16px; border: var(--bw) solid var(--edge); background: var(--surface); box-shadow: 0 4px 0 var(--shade); font-weight: 600; transition: transform .08s, box-shadow .08s, background .15s; }
.opt:hover:not([disabled]) { background: var(--surface-2); }
.opt:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 var(--shade); }
.opt .k { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--edge); display: grid; place-items: center; font: 600 14px/1 var(--f-mono); background: var(--surface-2); }
.opt[disabled] { cursor: default; }
.opt.right { background: var(--ok-soft); border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); }
.opt.right .k { background: var(--ok); border-color: var(--ok); color: #0b2416; }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: #2b0507; }
.opt.dim { opacity: .45; }
.opt.gone { opacity: .2; text-decoration: line-through; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.life { display: flex; gap: 8px; flex-wrap: wrap; }
.life .btn { font-size: 13px; padding: 8px 12px; box-shadow: 2px 2px 0 var(--shade); }
.hint { background: var(--surface); border: 2px dashed var(--edge); border-radius: 14px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; }
.hint svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--primary); }
.kbd { font: 600 11px/1.4 var(--f-mono); color: var(--muted); text-align: center; margin: 0; }
.blitz-clock { font: 800 52px/1 var(--f-display); text-align: center; font-variant-numeric: tabular-nums; }
.blitz-clock.warn { color: var(--bad); }

/* Hoja inferior de corrección */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-top: var(--bw) solid var(--edge); padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); animation: up .28s cubic-bezier(.2,.9,.3,1.1); max-height: 80vh; overflow-y: auto; }
.sheet.ok { background: var(--ok-soft); }
.sheet.ko { background: var(--bad-soft); }
@keyframes up { from { transform: translateY(100%); } }
.sheet-in { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
.sheet-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.sheet-head .mascot { width: 58px; height: 58px; }
.sheet-head h3 { font-size: 19px; }
.sheet.ok h3 { color: var(--ok); }
.sheet.ko h3 { color: var(--bad); }
.sheet-head p { margin: 2px 0 0; font-size: 14px; }
.vs { display: grid; gap: 8px; }
.vs div { border: 2px solid var(--edge); border-radius: 12px; padding: 9px 12px; background: var(--surface); font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.vs svg { width: 18px; height: 18px; margin-top: 2px; }
.vs .y svg { color: var(--bad); }
.vs s { text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.vs .g svg { color: var(--ok); }
.vs .g span { font-weight: 800; }
.vs small { display: block; font: 600 10px/1.4 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.learn { background: var(--surface); border: 2px solid var(--edge); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; font-size: 14px; }
.learn h4 { margin: 0; font: 800 13px/1.3 var(--f-display); display: flex; gap: 8px; align-items: center; }
.learn h4 svg { width: 17px; height: 17px; color: var(--primary); flex: none; }
.learn p { margin: 0; }
.learn ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.learn.trap { border-style: dashed; }
.learn.trap h4 svg { color: var(--bad); }
.learn .q { color: var(--muted); font-style: italic; }

/* Interludio, resultados y páginas */
.center { display: grid; justify-items: center; text-align: center; gap: 14px; padding-top: 30px; }
.center .mascot { width: 120px; height: 120px; }
.center h1 { font-size: clamp(22px, 6vw, 32px); font-weight: 800; }
.center p { margin: 0; color: var(--muted); max-width: 46ch; }
.grade { font: 800 clamp(64px, 16vw, 96px)/1 var(--f-display); letter-spacing: -.04em; }
.grade small { font-size: .3em; color: var(--muted); letter-spacing: 0; }
.big-stars svg { width: 46px; height: 46px; }
.big-stars .on { animation: pop .5s backwards; }
.big-stars .on:nth-child(2) { animation-delay: .15s; }
.big-stars .on:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.3); } }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
.kpis div { padding: 10px 6px; text-align: center; }
.kpis b { display: block; font: 800 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpis span { font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.banner-mini { padding: 10px 14px; display: flex; gap: 10px; align-items: center; text-align: left; background: var(--gold); color: var(--on-color); font-weight: 700; font-size: 14px; }
.banner-mini svg { width: 20px; height: 20px; flex: none; }
.left { text-align: left; width: 100%; display: grid; gap: 12px; }
.rv { padding: 12px 14px; display: grid; gap: 4px; font-size: 14px; border-left-width: 8px; border-left-color: var(--bad); }
.rv b { font-weight: 800; }
.rv .yo { color: var(--bad); }
.rv .ok { color: var(--ok); font-weight: 700; }
.rv .why { color: var(--muted); font-size: 13px; }
.page { padding-top: 4px; display: grid; gap: 16px; }
.page h1 { font-size: clamp(22px, 5vw, 32px); font-weight: 800; }
.panel { padding: 16px; display: grid; gap: 12px; }
.panel h2 { font-size: 17px; }
.trow { display: grid; grid-template-columns: 1fr 110px 46px; gap: 12px; align-items: center; font-size: 14px; }
.trow .track { height: 12px; }
.trow .track > i { background: var(--tc); }
.trow em { font-style: normal; font: 600 13px/1 var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }

  { tema: "t1", t: "Cómo nace y entra en vigor una ley", b: ["Proyecto de ley (Gobierno), proposición de ley (grupos parlamentarios) o iniciativa legislativa popular (al menos 500.000 firmas).", "El Rey la promulga como trámite formal.", "Se publica en el BOE (o en el boletín que corresponda).", "Entra en vigor a los 20 días de su completa publicación, salvo que diga otra cosa (art. 2 CC). Ese plazo es la vacatio legis.", "Solo se deroga por otra norma posterior."], truco: "BOE + 20 días = en vigor.", k: ["proyecto de ley", "proposicion", "iniciativa legislativa", "500.000", "promulga", "boe", "vacatio", "entra en vigor", "derogan", "publican"] },
  { tema: "t1", t: "Irretroactividad", b: ["La ley no tiene efectos hacia atrás: da seguridad jurídica.", "Las normas sancionadoras desfavorables o restrictivas de derechos individuales son SIEMPRE irretroactivas (art. 9.3 CE).", "Las demás pueden ser retroactivas si la propia norma lo dispone (art. 2.3 CC)."], k: ["irretroactiv", "retroactiv", "hacia atras", "sancionadoras", "seguridad juridica"] },
  { tema: "t1", t: "Costumbre y principios generales", b: ["Costumbre: segunda fuente. Norma no escrita que solo rige en defecto de ley. Requiere repetición de actos y convicción de que son obligatorios. Muy importante en Derecho mercantil.", "Principios generales: tercera fuente, en defecto de ley y costumbre. Además informan todo el ordenamiento (art. 1.4 CC).", "Ejemplos: «prior in tempore, potior in iure» y «el poseedor se presume propietario».", "Los jueces tienen el deber inexcusable de resolver (art. 1.7 CC)."], k: ["costumbre", "principios generales", "prior in tempore", "poseedor se presume", "inexcusable", "informador", "ius mercatorum", "no escrita"] },
  { tema: "t1", t: "Comunidades Autónomas", b: ["Art. 2 CE: unidad de la Nación y derecho a la autonomía.", "Norma suprema de cada CA: su Estatuto. El de Aragón es la LO 8/1982.", "Art. 149 CE: competencias exclusivas del Estado. Art. 148 CE: materias que pueden asumir las CCAA.", "Los conflictos los resuelve el Tribunal Constitucional.", "Competencias locales: Ley de Bases del Régimen Local."], truco: "149 = lo que se queda el Estado (el número más alto manda).", k: ["norma suprema de una comunidad", "estatuto de autonomia de aragon", "comunidad autonoma", "comunidades autonomas", "ccaa", "aragon", "149", "148", "unidad de la nacion", "regimen local", "competencias", "conflicto de competencias"] },
  { tema: "t1", t: "Instituciones de la Unión Europea", b: ["España entró en 1986. El Derecho de la UE prevalece sobre el nacional.", "Comisión: ejecutivo. Comisarios que priorizan el interés comunitario.", "Consejo de la UE: ministros. Principal órgano decisorio, legisla con el Parlamento.", "Consejo Europeo: jefes de Estado o de Gobierno. El Consejo de Europa NO es de la UE.", "Parlamento Europeo: elegido por sufragio universal.", "Tribunal de Justicia: interpreta y aplica el Derecho de la UE.", "Eurogrupo: órgano informal de ministros de finanzas del euro."], truco: "Consejo de la UE = Ministros. Consejo Europeo = Jefes. Consejo de Europa = no es de la UE.", k: ["comision", "comisarios", "consejo", "parlamento europeo", "tribunal de justicia", "eurogrupo", "1986", "prevalece"] },
  { tema: "t1", t: "Derecho originario y derivado de la UE", b: ["Acervo comunitario: todo el Derecho vigente de la UE.", "Originario: Tratados. Roma (1957), Constitución europea de 2004 (nunca entró en vigor) y Lisboa (en vigor desde el 1-12-2009). Hoy, TUE y TFUE.", "Reglamentos: generales, obligatorios en todo y directamente aplicables.", "Directivas: obligan al resultado y cada Estado elige los medios (transposición). Si no se transponen a tiempo, tienen efecto directo.", "Decisiones: obligatorias para sus destinatarios."], truco: "Reglamento = Ya. Directiva = Deberes para casa (transponer).", k: ["acervo", "tratado de roma", "lisboa", "constitucion europea", "tue", "reglamentos de la ue", "directiva", "decisiones", "efecto directo", "transpon", "originario"] },
  { tema: "t1", t: "Derecho público, privado y Constitución económica", b: ["Público: poderes públicos e interés general. Privado: relaciones entre particulares.", "Derecho patrimonial: parte del privado que regula la actividad económica.", "Civil: persona, bienes, contratos, familia y sucesiones. Aragón tiene su Código de Derecho Foral (DLeg 1/2011).", "Mercantil: Derecho del empresario en el mercado. Derecho de la Empresa = mercantil + financiero y tributario + trabajo.", "Constitución económica: art. 33 (propiedad y herencia), art. 38 (libertad de empresa) y arts. 128 y 131 (iniciativa pública y planificación). Los principios rectores no son derechos fundamentales.", "Dominio público: inembargable, imprescriptible e inalienable."], k: ["codigo de derecho foral de aragon", "principios rectores de la politica", "derecho publico", "derecho privado", "patrimonial", "derecho civil", "foral", "mercantil", "derecho de la empresa", "principios rectores", "dominio publico", "art. 38", "libertad de empresa", "expropiacion", "propiedad privada", "ade"] },

  // ---------- Tema 2 ----------
  { tema: "t2", t: "La relación jurídica patrimonial", b: ["Vínculo entre personas regulado por el Derecho que tiene por objeto una actividad económica.", "Una parte puede exigir algo a la otra con la coacción del poder público.", "Elementos: sujetos (activo/pasivo), objeto (sobre qué recae) y contenido (derechos y deberes).", "En los contratos, cada parte es a la vez titular de derechos y obligada (por ejemplo, trabajador y empresario)."], k: ["relacion juridica", "sujetos, objeto", "objeto de la relacion", "contenido de la relacion", "trabajador", "empresario", "titulares de derechos y obligados", "vendedor es acreedor"] },
  { tema: "t2", t: "Derecho subjetivo y derechos patrimoniales", b: ["Derecho subjetivo: poder de exigir algo a otro (o su abstención) con respaldo jurídico. Su cara opuesta es la obligación.", "Elementos: titular, objeto y contenido. Se protege con acciones.", "El titular puede ejercerlo o no.", "Patrimoniales: valorables en dinero. Extrapatrimoniales: personalísimos, de la personalidad y de familia (honor, intimidad…)."], k: ["derecho subjetivo", "cara contrapuesta", "acciones", "patrimonial", "extrapatrimonial", "personalidad", "titular, objeto", "decide no reclamar", "impide a nuria"] },
  { tema: "t2", t: "Capacidad jurídica y capacidad de obrar", b: ["Capacidad jurídica: aptitud para SER titular de derechos y obligaciones. La tiene toda persona desde que nace.", "Capacidad de obrar: aptitud para EJERCER esos derechos por uno mismo.", "La capacidad de obrar depende de la edad y del autogobierno."], truco: "Jurídica = tener. Obrar = hacer.", k: ["capacidad juridica", "capacidad de obrar", "autogobierno", "bebe", "hereda un piso"] },
  { tema: "t2", t: "Persona física: nacimiento, edad y muerte", b: ["Arts. 29 y 30 CC: la personalidad se adquiere al nacer con vida, una vez desprendido del seno materno. El nasciturus tiene protegidos sus derechos.", "Mayoría de edad: 18 años (art. 240 CC), con plena capacidad de obrar.", "Menor no emancipado: capacidad limitada (padres o tutor).", "Emancipado (mayor de 16): capacidad reducida.", "Art. 32 CC: la personalidad se extingue con la muerte."], k: ["nasciturus", "nacimiento", "art. 29", "art. 30", "18 anos", "menor", "emancip", "fallec", "seno materno", "mayor de edad", "art. 32", "17 anos", "16 anos", "persona fisica"] },
  { tema: "t2", t: "Particularidades del Derecho aragonés", b: ["Mayoría de edad: 18 años o matrimonio.", "El menor no está bajo patria potestad sino bajo autoridad familiar (padres, abuelos o hermanos).", "Mayor de 14 años: capacidad ampliada, actúa con asistencia."], truco: "Aragón: 14 con asistencia, 18 o boda para ser mayor.", k: ["vecindad civil aragonesa", "aragon", "autoridad familiar", "14 anos", "se casa", "matrimonio"] },
  { tema: "t2", t: "Discapacidad tras la Ley 8/2021", b: ["Desaparecen la incapacitación y la tutela de las personas con discapacidad.", "Convención de Nueva York (2006): capacidad jurídica en igualdad de condiciones.", "Toda persona con discapacidad tiene capacidad de obrar, con los apoyos que necesite.", "Priman las medidas voluntarias (art. 250 CC): la propia persona elige quién la apoya y cómo.", "A falta de ellas: guarda de hecho, curatela o defensor judicial."], k: ["discapacidad", "8/2021", "nueva york", "incapacit", "medidas de apoyo", "voluntari", "apoyos", "firma ante notario quien"] },
  { tema: "t2", t: "Guarda de hecho, curatela y defensor judicial", b: ["Guarda de hecho: apoyo informal, sin nombramiento. Necesita autorización judicial si actúa como representante.", "Curatela: medida judicial para apoyo continuado (art. 269 CC). Es asistencial y, en casos graves, representativa.", "Defensor judicial: apoyo ocasional o cuando hay conflicto de intereses (art. 295 CC)."], truco: "Guarda = sin papeles. Curatela = continuo y con juez. Defensor = puntual o conflicto.", k: ["guardador de hecho", "guarda de hecho", "guardador", "curatela", "curador", "defensor judicial", "conflicto de intereses", "apoyo continuado", "sin ningun nombramiento"] },
  { tema: "t2", t: "Persona jurídica", b: ["Organización de personas o bienes a la que la ley reconoce personalidad (art. 35 CC).", "Es independiente de sus miembros, tiene organización propia y vocación de permanencia.", "Actúa mediante representante (órgano de administración).", "Clases: corporaciones (públicas), asociaciones de interés público (sin lucro), fundaciones (patrimonio con fin altruista) y asociaciones de interés particular (sociedades con lucro)."], truco: "Lucro → interés particular. Sin lucro → interés público. Patrimonio + fin altruista → fundación.", k: ["persona juridica", "art. 35", "corporacion", "asociacion", "fundacion", "interes publico", "interes particular", "sociedad", "organo de administracion", "ong", "ayuntamiento", "s.l."] },
  { tema: "t2", t: "Representación y poderes", b: ["Regla general: cada uno ejerce sus derechos personalmente.", "Representación: un tercero actúa y los efectos recaen en el representado. Puede ser legal (padres) o voluntaria (apoderamiento).", "No cabe en actos personalísimos (por ejemplo, el testamento).", "Poderes generales o especiales. Algunos deben constar en documento público (art. 1280.5 CC), por ejemplo para vender un inmueble.", "Mandato: contrato que suele acompañar al poder.", "Poder falso, caducado o excedido: actos nulos salvo ratificación."], k: ["representacion", "representante", "poder", "apoderamiento", "mandato", "ratific", "personalisim", "documento publico", "1280", "testamento", "padres que actuan", "regla general en el ejercicio"] },

  // ---------- Tema 3 ----------
  { tema: "t3", t: "Derecho real y derecho de crédito", b: ["Derecho real: relación directa del titular con la cosa. Facultades: gozar, disponer y reivindicar.", "Es absoluto: eficacia erga omnes (frente a todos). Se consolida con su ejercicio.", "Derecho de crédito: permite exigir a una persona una prestación de dar, hacer o no hacer.", "Es relativo: solo frente al deudor. Se extingue cuando se cumple."], truco: "Real = yo → cosa, frente a todos. Crédito = yo → persona, solo frente al deudor.", k: ["derecho real", "derecho de credito", "erga omnes", "absoluto", "relativo", "se extingue", "se consolida", "gozar, disponer", "reivindicar"] },
  { tema: "t3", t: "La propiedad", b: ["Art. 33 CE la reconoce, con límites (función social y expropiación).", "Art. 348 CC: derecho de gozar y disponer de una cosa o animal sin más límites que los legales, con acción para reivindicarla.", "Es el dominio absoluto. Los derechos sobre cosa ajena son limitados (usufructo, servidumbre…).", "Facultades: goce (usar, consumir, frutos), disposición (vender, gravar) y reivindicación (recuperar del poseedor)."], k: ["348", "propiedad privada", "art. 33", "dos caras", "dominacion absoluta", "objeto del derecho de propiedad", "facultades de goce", "goce", "disposicion", "reivindica", "moto robada"] },
  { tema: "t3", t: "Modos de adquirir la propiedad (art. 609 CC)", b: ["Originarios (sin depender del anterior dueño): ocupación (muebles sin dueño o silvestres), accesión (unión o construcción) y usucapión (posesión prolongada).", "Derivativos (del anterior titular, con sus cargas): donación, sucesión mortis causa y tradición.", "Tradición = título (contrato) + modo (entrega o escritura)."], truco: "Originarios OAU: Ocupación, Accesión, Usucapión. Derivativos DST: Donación, Sucesión, Tradición.", k: ["609", "originari", "derivativ", "ocupacion", "accesion", "usucapion", "prescripcion adquisitiva", "donacion", "sucesion", "herencia", "tradicion", "titulo y modo", "traditio", "silvestre", "res nullius", "regala", "hereda", "titulo"] },
  { tema: "t3", t: "Propiedad intelectual", b: ["Base: art. 20.1 b) CE, arts. 428-429 CC y TRLPI.", "Objeto inmaterial, carácter temporal y rendimiento económico.", "Se protege la obra que exterioriza una idea de forma original, no la idea sin expresar.", "Autor: la persona natural que crea la obra.", "Duración: vida del autor + 70 años.", "Facultades morales (irrenunciables e inalienables): autoría, divulgación, nombre. Facultades económicas: explotación (exclusiva) y remuneración (crédito)."], truco: "Lo moral no se vende. Lo económico sí.", k: ["intelectual", "autor", "obra", "70 anos", "facultades morales", "explotacion", "remuneracion", "trlpi", "20.1", "428", "idea", "editorial", "pintor"] },
  { tema: "t3", t: "Derechos reales de goce", b: ["Permiten disfrutar de una cosa ajena.", "Usufructo (art. 467 CC): disfrutar conservando la forma. El dueño es el nudo propietario.", "Servidumbre: gravamen de un predio sirviente a favor de un predio dominante (paso, vistas…).", "Superficie: construir o plantar en suelo ajeno hasta 99 años.", "Vuelo/subvuelo y aprovechamiento por turnos (multipropiedad)."], truco: "Sirviente sirve (soporta). Dominante domina (se beneficia).", k: ["sobre cosa ajena (limitado)", "derechos reales de goce permiten", "usufruct", "nudo propietario", "servidumbre", "predio", "superficie", "99 anos", "multipropiedad", "turnos", "vuelo", "hotel en un terreno", "de por vida"] },
  { tema: "t3", t: "Garantías personales y reales", b: ["Garantía: refuerzo de un crédito para asegurar su cobro.", "Personales: fianza, aval, garantía a primer requerimiento, cartas de patrocinio.", "Reales: prenda, hipoteca y anticresis.", "Si el deudor no paga, se vende la cosa. Está prohibido el pacto comisorio (el acreedor no se queda la cosa directamente).", "La garantía real no elimina la responsabilidad del deudor con el resto de su patrimonio."], k: ["garantia", "fianza", "aval", "pacto comisorio", "responsabilidad personal", "se queda tu casa", "padre de javier"] },
  { tema: "t3", t: "Prenda, hipoteca y anticresis", b: ["Prenda: bienes muebles, con desplazamiento de la posesión (el deudor deja de usar el bien).", "Hipoteca: inmuebles, sin desplazamiento. Requiere escritura pública e inscripción (constitutiva).", "El hipotecante puede ser un tercero distinto del deudor.", "La hipoteca es accesoria del crédito. Al pagar, hay que inscribir la cancelación. Ejecutarla no extingue lo que quede de deuda.", "Anticresis: el acreedor cobra con los frutos de un inmueble del deudor."], truco: "Prenda = la Presto (me la llevo). Hipoteca = la casa se queda contigo.", k: ["forma exige la hipoteca", "se ejecuta la hipoteca", "prenda", "hipoteca", "anticresis", "desplazamiento", "hipotecante", "cancelacion", "bienes muebles", "bienes inmuebles", "anillo", "alquileres de un piso"] },
  { tema: "t3", t: "Tanteo, retracto y opción de compra", b: ["Derechos reales de adquisición: permiten comprar con preferencia (colindante, arrendatario…).", "Tanteo: ANTES de la venta a un tercero, en las mismas condiciones.", "Retracto: DESPUÉS de la venta, subrogándose en el lugar del comprador.", "Opción de compra: plazo y precio pactados. Vender a otro durante el plazo es incumplir. Ejemplo: leasing."], truco: "TAnteo = Antes. REtracto = REcuperar después.", k: ["tanteo", "retracto", "opcion de compra", "leasing", "adquisicion preferente", "derechos reales de adquisicion", "subrog", "podra comprarla"] },
  { tema: "t3", t: "El Registro de la Propiedad", b: ["Inscribe actos sobre derechos reales en inmuebles. Su función es la publicidad.", "Inscripción voluntaria y declarativa, salvo hipoteca y superficie (constitutiva).", "Solo documentos públicos. También algunos derechos personales (arrendamientos, opciones).", "Se organiza por fincas (folio real). La inmatriculación abre el folio.", "Prioridad: primero en presentar, primero en derecho.", "El registrador califica; se recurre ante la DGSJFP y luego en vía civil.", "Efectos erga omnes y legitimación: se presume cierto lo inscrito."], k: ["registro", "inscripcion", "inscribir", "constitutiva", "declarativa", "inmatriculacion", "folio", "prioridad", "calificacion", "registrador", "legitimacion", "documentos publicos", "direccion general", "contrato privado", "9:00"] },
  { tema: "t3", t: "El tercero hipotecario (art. 34 LH)", b: ["Protege a quien adquiere confiando en el Registro.", "Requisitos: buena fe, título oneroso, adquirir de quien figura inscrito con facultades, inscribir y que el contrato sea válido.", "Ventaja: no le perjudican los títulos no inscritos."], truco: "BOTIV: Buena fe, Oneroso, Titular inscrito, Inscribir, Válido.", k: ["tercero hipotecario", "34 lh", "art. 34 ", "buena fe", "titulo oneroso", "no inscrito", "oneroso", "como donacion"] },

  // ---------- Tema 4 ----------
  { tema: "t4", t: "La obligación: concepto y elementos", b: ["Vínculo por el que un deudor debe realizar una prestación a favor de un acreedor que puede exigirla (arts. 1088-1253 CC).", "Toda obligación consiste en dar, hacer o no hacer (art. 1088 CC).", "Requisitos: que se pueda exigir, que nazca de una fuente y que sea valorable económicamente.", "Elementos: sujetos, fuente, prestación y vínculo.", "Situación bipolar: acreedor (derecho de crédito) y deudor (deuda). En los contratos hay reciprocidad."], k: ["obligacion es", "1088", "dar, hacer o no hacer", "requisito de la obligacion", "elementos de la obligacion", "vinculo", "bipolar", "acreedor es titular", "deudor es sujeto", "reciprocidad", "fuerza de ley entre"] },
  { tema: "t4", t: "Solidaridad y mancomunidad", b: ["Solidaria (art. 1137 CC): cada deudor responde del total. Quien paga todo reclama a los demás con la acción de repetición (art. 1145 CC).", "Mancomunada o parciaria (art. 1138 CC): la deuda se divide y cada uno responde de su parte.", "La solidaridad no se presume: si no se pacta, es mancomunada. En la práctica se pacta mucho porque facilita el cobro."], truco: "Solidaria = todos por el todo. Mancomunada = cada uno lo suyo. Sin pacto → mancomunada.", k: ["solidari", "mancomun", "repeticion", "codeudor", "1137", "1138", "varios deudores"] },
  { tema: "t4", t: "Fuentes de las obligaciones (art. 1089 CC)", b: ["La ley: solo obliga en lo que dice expresamente (art. 1090).", "El contrato: la fuente más frecuente; tiene fuerza de ley entre las partes (art. 1091).", "El cuasicontrato: hecho lícito y voluntario (gestión de negocios ajenos, cobro de lo indebido).", "Los actos ilícitos: delitos (art. 1092) y daños por culpa o negligencia."], truco: "LCCI: Ley, Contrato, Cuasicontrato, Ilícito. La costumbre no está.", k: ["1089", "fuentes de las obligaciones", "cuasicontrato", "gestion de negocios", "cobro de lo indebido", "ilicito", "delito", "culpa o negligencia", "1903", "1090", "1091", "fuente mas frecuente", "nacen de la ley"] },
  { tema: "t4", t: "La prestación", b: ["Es la conducta debida: lo que el acreedor puede reclamar.", "Debe ser posible, lícita y determinada (o determinable).", "Si falta un requisito, la obligación es nula."], truco: "PLD: Posible, Lícita, Determinada.", k: ["prestacion", "posible, licita", "determinable", "imposible", "no competir"] },
  { tema: "t4", t: "Tipos de obligaciones", b: ["Positivas (dar/hacer) y negativas (no hacer).", "Genéricas (por género o cantidad) y específicas (cosa concreta).", "Cumulativas (todas las prestaciones) y alternativas (basta una).", "Tracto único (un acto) y sucesivo (periódicas, como el alquiler).", "Principales y accesorias.", "Condicionales (hecho futuro e incierto) y a término (plazo).", "De medios (diligencia) y de resultado (fin concreto)."], k: ["ejecutar varias prestaciones", "ejecutando solo una de las varias", "positivas", "negativa", "generica", "especifica", "cumulativa", "alternativa", "tracto", "accesoria", "condicional", "termino", "de medios", "de resultado"] },
  { tema: "t4", t: "Deudas de dinero y nominalismo", b: ["Obligación pecuniaria: entregar dinero de curso legal. Es genérica y la más habitual.", "El dinero es medida de valor, instrumento de cambio y medio de pago.", "Nominalismo (rige en España): se paga la cifra pactada aunque haya inflación.", "Valorismo: se paga el poder adquisitivo original.", "Para protegerse: cláusulas de estabilización."], truco: "Nominalismo = el número manda.", k: ["sistema valorista", "pecuniaria", "dinero", "nominalis", "valorista", "inflacion", "estabilizacion"] },
  { tema: "t4", t: "Los intereses", b: ["Porcentaje sobre el capital por un periodo de tiempo.", "Retributivos (precio del dinero) y moratorios (por retraso). Legales o convencionales (con el límite de la Ley de Usura).", "Los préstamos no generan intereses si no se pactan.", "Mora sin pacto: interés legal (art. 1108). Primero se pagan intereses y luego capital (art. 1173).", "Los intereses vencidos generan interés legal desde la reclamación judicial (art. 1109).", "Si cobras el capital sin reservar los intereses, los pierdes (art. 1110).", "La acción prescribe a los 5 años."], k: ["interes", "usura", "moratorio", "retributivo", "convencional", "1108", "1109", "1110", "1173", "prescribe"] },
  { tema: "t4", t: "Extinción y pago", b: ["Art. 1156 CC: pago, pérdida de la cosa, condonación, confusión, compensación y novación.", "Pago: ejecución exacta e íntegra de la prestación (art. 1157).", "Pago a un tercero: no libera, salvo que sea útil al acreedor o se haga de buena fe a un acreedor aparente. Pago por un tercero: se admite.", "Compensación: deudas recíprocas, de dinero, vencidas, líquidas y exigibles.", "Dación en pago: entregar otra cosa, con aceptación del acreedor. Cesión de bienes: se venden para pagar; si no llega, se sigue debiendo.", "Condonación o quita: perdón total o parcial."], truco: "PPCCCN: Pago, Pérdida, Condonación, Confusión, Compensación, Novación.", k: ["el pago exige", "1156", "extincion", "pago", "se entiende pagada", "1157", "tercero", "compensacion", "dacion", "cesion de bienes", "condonacion", "quita", "confusion", "novacion", "personalisimas"] },
  { tema: "t4", t: "Incumplimiento y mora", b: ["Incumplimiento: cualquier conducta distinta de la debida. Puede ser total, defectuoso o tardío (mora).", "No se responde en caso fortuito o fuerza mayor.", "Mora (art. 1100 CC): retraso imputable + reclamación del acreedor (salvo pacto o plazo esencial).", "Efectos: se sigue debiendo y además se indemniza (o se pagan intereses moratorios).", "Si el retraso hace inútil la prestación, es incumplimiento total."], k: ["efectos tiene la mora", "incumplimiento", "mora", "1100", "fortuito", "fuerza mayor", "retraso", "reclamacion"] },
  { tema: "t4", t: "Qué puede hacer el acreedor", b: ["Acción de cumplimiento: que el juez imponga la prestación, o su equivalente si no es posible.", "Acción de resarcimiento: daños y perjuicios. Hay que probar el daño emergente (pérdida) o el lucro cesante (ganancia perdida).", "En contratos recíprocos: excepción de incumplimiento (no cumplo si tú no cumples) o, si ya cumplí, exigir el cumplimiento o resolver, más daños (art. 1124 CC)."], truco: "Emergente = lo que pierdo. Cesante = lo que dejo de ganar.", k: ["accion de cumplimiento", "equivalente", "resarcimiento", "danos", "lucro cesante", "emergente", "1124", "resolver", "excepcion de incumplimiento", "1106", "compatible"] },
  { tema: "t4", t: "Responsabilidad patrimonial universal", b: ["Art. 1911 CC: el deudor responde con todos sus bienes, presentes y futuros.", "Es garantía para el acreedor y estímulo para el deudor.", "Afecta al patrimonio, no a la persona.", "Se ejecuta mediante embargo y venta, salvo bienes inembargables (salario hasta el SMI, útiles de trabajo…)."], k: ["1911", "responsabilidad patrimonial", "todos sus bienes", "embargo", "inembargable", "smi", "resto del patrimonio", "medidas generales"] },
  { tema: "t4", t: "Acción subrogatoria y acción pauliana", b: ["Subrogatoria o indirecta (art. 1111): el acreedor reclama en nombre del deudor créditos que este no cobra. Lo recuperado entra en el patrimonio del deudor y beneficia a todos los acreedores.", "Pauliana o revocatoria (art. 1291): anula ventas o regalos hechos en fraude para que los bienes vuelvan al deudor. Exige intención de defraudar y perjuicio.", "Se presumen fraudulentas las transmisiones gratuitas y las onerosas tras sentencia o embargo (art. 1297).", "Ambas son subsidiarias: solo tras agotar los bienes del deudor."], truco: "Subrogatoria = meter lo que no entra. Pauliana = recuperar lo que salió.", k: ["se presumen fraudulentos", "subrogatoria", "pauliana", "revocatoria", "indirecta", "fraude", "1111", "1291", "1297", "subsidiaria", "regala su casa", "no la reclama", "vende su coche"] },
  { tema: "t4", t: "Garantías específicas del crédito", b: ["Refuerzan la protección general y deben pactarse.", "Personales: permiten reclamar a un tercero (por ejemplo, un fiador).", "Reales: dan un poder sobre una cosa (prenda, hipoteca, anticresis)."], k: ["garantias especificas", "garantias personales", "garantias reales", "proteccion especificas", "refuerzo"] },
  { tema: "t4", t: "El contrato y sus principios", b: ["Económicamente, el contrato es un medio para intercambiar. Jurídicamente, es un acuerdo de voluntades para crear, modificar o extinguir relaciones jurídicas.", "Es ley entre las partes (art. 1091): «pacta sunt servanda».", "Funciones: fuente principal de obligaciones y título para transmitir la propiedad.", "Principios: autonomía de la voluntad (art. 1254), libertad de forma (art. 1278) y libertad de contenido con límites de ley, moral y orden público (art. 1255)."], k: ["contrato es", "economico", "juridicamente", "pacta sunt", "autonomia de la voluntad", "libertad de forma", "libertad de contenido", "1254", "1255", "1278", "funciones de los contratos", "norma entre las partes"] },
  { tema: "t4", t: "Consentimiento, objeto y causa", b: ["Art. 1261 CC: sin consentimiento, objeto cierto y causa no hay contrato. A veces también se exige forma.", "Consentimiento: coinciden la voluntad interna, la declarada y la común.", "Objeto: cosas en el comercio (incluso futuras) y servicios lícitos. Debe ser posible, lícito y determinado.", "Causa: la razón o fin del contrato. Debe existir, ser lícita y ser verdadera."], truco: "COC: Consentimiento, Objeto, Causa.", k: ["la causa del contrato es", "1261", "elementos esenciales", "consentimiento", "objeto", "causa"] },
  { tema: "t4", t: "Vicios del consentimiento", b: ["Error (art. 1266): esencial y excusable.", "Violencia o intimidación (art. 1267): fuerza o amenaza de un mal grave e inminente. Puede venir de un tercero. El miedo reverencial no cuenta.", "Dolo (arts. 1269-1270): engaño grave que induce a contratar. Cabe por omisión y de un tercero; no hace falta daño.", "Un vicio hace el contrato anulable."], truco: "EVID: Error, Violencia, Intimidación, Dolo.", k: ["como vicio del consentimiento", "intimidacion proceder", "vicio", "error", "violencia", "intimidacion", "dolo", "miedo reverencial", "maquinaciones", "omision"] },
  { tema: "t4", t: "Clases de contratos", b: ["Unilaterales y bilaterales (sinalagmáticos).", "Consensuales (basta el consentimiento), reales (exigen entrega: préstamo, depósito) y formales.", "Onerosos (intercambio) y gratuitos (donación).", "Conmutativos (prestaciones fijas) y aleatorios (dependen del azar).", "Negociados y de adhesión (una parte redacta; la otra acepta o no)."], k: ["contratos consensuales se perfeccionan", "contrato oneroso es", "contrato aleatorio es", "bilateral", "unilateral", "sinalagmatico", "consensual", "reales", "formal", "oneroso", "gratuito", "donacion", "aleatorio", "conmutativo", "prestamo y el deposito", "redaccion unilateral"] },
  { tema: "t4", t: "Nulidad y anulabilidad", b: ["Nulidad: falta un elemento esencial o se viola una norma imperativa. No produce efectos, no se convalida, la acción no prescribe y puede alegarla cualquiera (o el juez de oficio). Se restituye todo (arts. 1303 y 1307).", "Anulabilidad: vicios del consentimiento, falta de capacidad o falta de consentimiento del cónyuge. Plazo de 4 años (art. 1301). Solo la alega la persona protegida. Si no se ejerce, el contrato sigue valiendo.", "El menor o la persona con discapacidad sin apoyos solo restituye aquello en que se enriqueció."], truco: "Nulo = nunca nació. Anulable = enfermo: 4 años y solo lo alega la víctima.", k: ["que contratos son nulos", "causa de anulabilidad", "nulidad", "nulo", "anulab", "1301", "1303", "1307", "convalid", "restitu", "prescribe la accion de nulidad", "alegar la nulidad"] },
  { tema: "t4", t: "Formación y perfección del contrato", b: ["Fases: formación (tratos), perfección (nace) y consumación (se ejecuta).", "Se perfecciona por el mero consentimiento: la oferta y la aceptación coinciden (arts. 1258 y 1262).", "Obliga a lo pactado y a lo que exijan la buena fe, el uso y la ley.", "Obliga a los contratantes y a sus herederos (art. 1257).", "Inalterabilidad e irrevocabilidad, salvo desistimiento en contratos de confianza o de consumo."], k: ["la perfeccion del contrato es", "los contratos se perfeccionan", "fases", "perfeccion", "1258", "1262", "oferta y la aceptacion", "1257", "herederos", "inalterabilidad", "irrevocabilidad", "desistimiento"] },
  { tema: "t4", t: "Contratos de adhesión", b: ["Modelos redactados por una parte; la otra solo acepta.", "Ley 7/1998 de condiciones generales de la contratación.", "Para incorporarse, las cláusulas deben ser conocidas, claras, transparentes, concretas y sencillas.", "Las dudas se interpretan a favor del adherente.", "Las cláusulas abusivas son nulas."], k: ["adhesion", "condiciones generales", "7/1998", "adherente", "abusiva", "incorporarse"] },
  { tema: "t4", t: "Contratación electrónica", b: ["Regulada por la LSSI y la LSEC, además del CC y el CCom.", "Plena validez sin necesidad de acuerdo previo.", "El documento electrónico equivale al escrito y la firma electrónica cualificada a la manuscrita.", "Antes de contratar: informar de los pasos, de cómo corregir errores y de los idiomas disponibles.", "Después: acuse de recibo en 24 horas o confirmación equivalente (art. 28 LSSI).", "Lugar: residencia del consumidor; entre empresarios, donde esté el prestador.", "Smart contracts: se ejecutan con código y se rigen por las reglas generales."], k: ["electronic", "lssi", "lsec", "acuse de recibo", "24 horas", "smart", "residencia habitual", "automatizad"] },

  { tema: "t8", t: "Qué es publicidad", b: ["Art. 2 LGP: comunicación de una persona física o jurídica, pública o privada, en su actividad comercial, industrial o profesional, para promover la contratación.", "Es un acto de competencia y una práctica comercial.", "Queda fuera la propaganda política, electoral o institucional.", "Debe ser lícita (arts. 3 y ss. LGP)."], truco: "Si no busca que compres o contrates, no es publicidad.", k: ["quien puede realizar publicidad", "comportamiento economico de", "derecho de la publicidad", "art. 2 lgp", "define la publicidad", "promover la contratacion", "naturaleza juridica", "excluid", "propaganda", "institucional", "licitud", "actividad comercial, industrial", "partido politico"] },

const fmtDay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  } catch (e) {}
};

// ---------- Juego ----------
const TIME_Q = 20, BLITZ_T = 60;
const CHEERS = ['¡Bien ahí!', '¡Crack!', '¡Exacto!', '¡Correctísimo!', '¡Lo tienes!', '¡Eso es!', '¡De matrícula!'];
const STREAK_CHEERS = { 3: '¡Tres seguidas!', 5: '¡Estás en racha!', 8: '¡Imparable!', 10: '¡Modo magistrado/a!', 15: '¡Esto ya es jurisprudencia!', 20: '¡Leyenda del Código Civil!' };
const OOPS = ['Casi. Vamos a verlo bien', 'Esta tenía truco', 'Tranqui, así se aprende', 'Esta se te ha escapado'];
const mkItem = id => { const b = BANK[id]; const opts = shuffle([b.right, ...b.wrong]); return { id, q: b.q, opts, correct: opts.indexOf(b.right), e: b.e, tema: b.tema, lvl: b.lvl }; };
const mult = s => s >= 10 ? 3 : s >= 6 ? 2 : s >= 3 ? 1.5 : 1;

const startGame = cfg => {
  leave();
  let ids = [], title = '';
  const all = Object.keys(BANK);
  if (cfg.mode === 'level') { const t = temaById(cfg.tema); ids = shuffle(t.niveles[cfg.lvl].q.map((_, i) => t.id + '-' + cfg.lvl + '-' + i)); title = 'Tema ' + t.num + ' · Nivel ' + (cfg.lvl + 1); }
  else if (cfg.mode === 'exam') { ids = shuffle(all.filter(id => BANK[id].tema === cfg.tema)).slice(0, 30); title = 'Examen · Tema ' + temaById(cfg.tema).num; }
  else if (cfg.mode === 'global') { const per = TEMAS.map(t => shuffle(all.filter(id => BANK[id].tema === t.id))); let k = 0; while (ids.length < 30) { const p = per[k % per.length]; if (p.length) ids.push(p.pop()); k++; } ids = shuffle(ids); title = 'Examen global'; }
  else if (cfg.mode === 'review') { ids = shuffle(failIds(cfg.tema)).slice(0, 30); title = cfg.tema ? 'Mis fallos · Tema ' + temaById(cfg.tema).num : 'Mis fallos'; }
  else if (cfg.mode === 'blitz') { ids = shuffle(all); title = 'Relámpago'; }
  if (!ids.length) { toast(I.check + '<span>¡No te queda nada pendiente aquí!</span>'); go(cfg.tema ? 'tema' : 'home', cfg.tema ? { id: cfg.tema } : {}); return; }
  touchDay();
  G = { ...cfg, title, items: ids.map(mkItem), i: 0, score: 0, streak: 0, bestStreak: 0, ok: 0, wrongs: [], life: { fifty: 1, hint: 1, skip: 1 }, usedLife: false, answered: false, gone: [], hinted: false, tLeft: TIME_Q, blitzLeft: BLITZ_T, retry: null, recovered: 0 };
  view = 'game'; window.scrollTo(0, 0);
  if (cfg.mode === 'blitz') tick = setInterval(() => { G.blitzLeft--; const c = $('#blitzClock'); if (c) { c.textContent = G.blitzLeft; c.classList.toggle('warn', G.blitzLeft <= 10); } const pr = $('.prog > i'); if (pr) pr.style.width = (G.blitzLeft / BLITZ_T * 100) + '%'; if (G.blitzLeft <= 0) { stopTimers(); finish(); } }, 1000);
  drawQ();
};
const cur = () => G.retry ? G.retry.items[G.retry.i] : G.items[G.i];
const startQTimer = () => {
  if (G.mode === 'blitz') return; stopTimers(); if (!S.settings.timer || G.retry) return;
  G.tLeft = TIME_Q; const t0 = Date.now();
  tick = setInterval(() => {
    const left = Math.max(0, TIME_Q - (Date.now() - t0) / 1000); G.tLeft = left;
    const bar = $('#tbar'); if (bar) { bar.firstElementChild.style.width = (left / TIME_Q * 100) + '%'; bar.classList.toggle('warn', left < 6); }
    if (left <= 0) { stopTimers(); answer(-1); }
  }, 100);
};
const hintBox = it => { const n = noteFor(it.id); return n ? `<div class="hint">${I.bulb}<span><b>Pista · ${esc(n.t)}:</b> ${esc(n.truco || n.b[0])}</span></div>` : ''; };
const drawQ = () => {
  header(); layer.innerHTML = '';
  const it = cur(); const t = temaById(it.tema); const m = mult(G.streak); const blitz = G.mode === 'blitz';
  const total = G.retry ? G.retry.items.length : G.items.length; const pos = G.retry ? G.retry.i : G.i;
  const pct = blitz ? (G.blitzLeft / BLITZ_T * 100) : (pos / total * 100);
  app.innerHTML = `<div class="game" style="--tc:${tc(it.tema)}">
    <div class="hud">
      <button class="sq press" id="quit" aria-label="Salir de la partida">${I.cross}</button>
      <div class="prog" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <span class="pill combo ${m > 1 ? 'hot' : ''}" title="Multiplicador por racha">${I.flame}x${m}</span>
    </div>
    ${blitz ? `<div class="blitz-clock ${G.blitzLeft <= 10 ? 'warn' : ''}" id="blitzClock" aria-live="polite">${G.blitzLeft}</div>` : ''}
    ${S.settings.timer && !blitz && !G.retry ? '<div class="timer" id="tbar"><i style="width:100%"></i></div>' : ''}
    <div class="qhead">
      <span class="tag ${G.retry ? 'retry' : ''}">${G.retry ? 'Ronda de repaso' : 'T' + t.num + ' · Nivel ' + (it.lvl + 1)}</span>
      <span class="pill">${blitz ? G.ok + ' aciertos' : (pos + 1) + '/' + total}</span>
    </div>
    <div class="qtext fade">${esc(it.q)}</div>
    <div class="opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    ${G.hinted ? hintBox(it) : ''}
    ${blitz || G.retry ? '' : `<div class="life">
      <button class="btn press" id="l50" ${G.life.fifty ? '' : 'disabled'}>${I.half} 50/50</button>
      <button class="btn press" id="lhint" ${G.life.hint && noteFor(it.id) ? '' : 'disabled'}>${I.bulb} Pista</button>
      <button class="btn press" id="lskip" ${G.life.skip ? '' : 'disabled'}>${I.skip} Cambiar</button>

const fifty = () => {

  $('#l50').disabled = true;
};
const hint = () => {
  if (!G.life.hint || G.answered) return; const it = cur(); if (!noteFor(it.id)) return;
  G.life.hint = 0; G.usedLife = true; G.hinted = true; $('#lhint').disabled = true;
  $('.opts').insertAdjacentHTML('afterend', hintBox(it));
};
const skipQ = () => {
  if (!G.life.skip || G.answered) return; G.life.skip = 0; G.usedLife = true;
  const used = new Set(G.items.map(x => x.id));
  let pool = Object.keys(BANK).filter(id => !used.has(id) && (G.mode === 'level' ? BANK[id].tema === G.tema && BANK[id].lvl === G.lvl : !G.tema || BANK[id].tema === G.tema));
  if (!pool.length) pool = Object.keys(BANK).filter(id => !used.has(id) && (!G.tema || BANK[id].tema === G.tema));
  if (!pool.length) { toast('<span>No quedan preguntas para cambiar</span>'); return; }
  G.items[G.i] = mkItem(pick(pool)); G.hinted = false; drawQ();
};

const answer = k => {
  if (!G || G.answered) return; G.answered = true; stopTimers();
  const it = cur(); const right = k === it.correct; const blitz = G.mode === 'blitz';
  const st = S.stats[it.tema] || (S.stats[it.tema] = { a: 0, c: 0 });
  if (!G.retry) { st.a++; S.answered++; bumpToday(); }
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; const kk = +b.dataset.k; if (kk === it.correct) b.classList.add('right'); else if (kk === k) b.classList.add('wrong'); else b.classList.add('dim'); });
  document.querySelectorAll('.life .btn').forEach(b => b.disabled = true);
  if (right) {
    if (!G.retry) { st.c++; S.correct++; G.ok++; }
    G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); S.bestStreak = Math.max(S.bestStreak || 0, G.streak);
    const gained = G.retry ? 50 : Math.round(100 * mult(G.streak) * (G.hinted ? .5 : 1) + (S.settings.timer && !blitz ? Math.round(G.tLeft) * 5 : 0));
    G.score += gained; sOk();
    if (S.fails[it.id]) { delete S.fails[it.id]; if (G.retry || G.mode === 'review') { S.fixed++; G.recovered++; } }
    const fl = document.createElement('div'); fl.className = 'float'; fl.textContent = '+' + gained; document.body.appendChild(fl); setTimeout(() => fl.remove(), 900);
    if (G.streak >= 5 && G.streak % 5 === 0) confetti(50);
  } else {
    G.streak = 0; S.fails[it.id] = (S.fails[it.id] || 0) + 1; sKo();
    if (!G.retry) G.wrongs.push({ it, k });
  }
  save();
  if (blitz) { setTimeout(() => { if (!G || G.blitzLeft <= 0) return; G.i++; if (G.i >= G.items.length) { stopTimers(); finish(); } else drawQ(); }, right ? 350 : 1200); return; }
  const pr = $('.prog > i'); if (pr) { const total = G.retry ? G.retry.items.length : G.items.length; pr.style.width = (((G.retry ? G.retry.i : G.i) + 1) / total * 100) + '%'; }
  const combo = $('.pill.combo'); if (combo) { combo.innerHTML = I.flame + 'x' + mult(G.streak); combo.classList.toggle('hot', mult(G.streak) > 1); }
  showSheet(it, k, right);
};

const showSheet = (it, k, right) => {
  const note = noteFor(it.id);
  if (right) {
    layer.innerHTML = `<div class="sheet ok" role="status"><div class="sheet-in">
      <div class="sheet-head">${mascot(G.streak >= 5 ? 'cool' : 'happy', tc(it.tema))}<div><h3>${esc(STREAK_CHEERS[G.streak] || pick(CHEERS))}</h3><p>${esc(it.e)}</p></div></div>
      <button class="btn go lg block press" id="next">Continuar ${I.chev}</button></div></div>`;
  } else {

      <div class="sheet-head">${mascot('sad', tc(it.tema))}<div><h3>${k === -1 ? 'Se acabó el tiempo' : esc(pick(OOPS))}</h3><p>Dedícale 30 segundos y no se te vuelve a olvidar.</p></div></div>
      <div class="vs">
        ${chosen ? `<div class="y">${I.cross}<span><small>Marcaste</small><s>${esc(chosen)}</s></span></div>` : ''}

      ${note ? `<div class="learn"><h4>${I.book} Mini-apunte · ${esc(note.t)}</h4><ul>${note.b.map(x => '<li>' + esc(x) + '</li>').join('')}</ul>${note.truco ? '<div class="truco">' + I.bulb + '<span>' + esc(note.truco) + '</span></div>' : ''}</div>` : ''}

const nextQ = () => {

const interlude = () => {

  $('#goRetry').onclick = () => { G.retry = { items: shuffle(G.wrongs.map(w => mkItem(w.it.id))), i: 0 }; G.streak = 0; drawQ(); };
  $('#skipRetry').onclick = finish;
  $('#goRetry').focus();
};

const finish = () => {

    </div>
    ${unlocked ? `<div class="stk banner-mini">${I.trophy}<span>${esc(unlocked)}</span></div>` : ''}
    ${newBest && !blitz ? `<div class="stk banner-mini">${I.star}<span>¡Tu mejor marca en este nivel!</span></div>` : ''}
    <div class="row" style="justify-content:center">
      <button class="btn primary lg press" id="rAgain">${I.redo} Repetir</button>
      ${g.mode === 'level' && stars > 0 && g.lvl + 1 < temaById(g.tema).niveles.length ? `<button class="btn go lg press" id="rNext">Siguiente nivel ${I.chev}</button>` : ''}
      <button class="btn lg press" id="rBack">${g.tema ? 'Al tema' : 'Inicio'}</button>
    </div>
    ${weakList.length ? `<div class="left"><div class="sec" style="margin-top:14px"><h2>Conceptos a repasar</h2><span>${weakList.length}</span></div>
      <div class="notes">${weakList.map((w, k) => noteCard(w.n, k === 0, ' <span class="tiny">· ' + w.c + (w.c === 1 ? ' fallo' : ' fallos') + '</span>')).join('')}</div></div>` : ''}
    ${g.wrongs.length ? `<details class="left" ${g.wrongs.length <= 5 ? 'open' : ''}><summary class="sec" style="margin-top:6px;cursor:pointer"><h2>Tus fallos</h2><span>${g.wrongs.length} · ver lista</span></summary><div class="left" style="margin-top:12px">
      ${g.wrongs.map(({ it, k }) => `<div class="stk rv"><b>${esc(it.q)}</b><span class="yo">${k === -1 ? 'Sin responder' : 'Marcaste: ' + esc(it.opts[k])}</span><span class="ok">Correcta: ${esc(it.opts[it.correct])}</span><span class="why">${esc(it.e)}</span></div>`).join('')}</div></details>` : ''}
  </div>`;
  window.scrollTo(0, 0);
  $('#rAgain').onclick = () => startGame({ mode: g.mode, tema: g.tema, lvl: g.lvl });
  const nx = $('#rNext'); if (nx) nx.onclick = () => startGame({ mode: 'level', tema: g.tema, lvl: g.lvl + 1 });
  $('#rBack').onclick = () => g.tema ? go('tema', { id: g.tema }) : go('home');
  if (stars === 3 || (blitz && newBest && g.ok > 0)) { confetti(); sWin(); } else if (stars > 0) { confetti(60); sWin(); }
  announceAch(ach);
};

// ---------- Teclado ----------
document.addEventListener('keydown', e => {
  if (view !== 'game' || !G || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
  if (k !== undefined && !G.answered && !G.gone.includes(k) && document.querySelector('.opt')) { e.preventDefault(); answer(k); }
  else if (e.key === 'Enter' && G.answered && G.mode !== 'blitz' && $('#next')) { e.preventDefault(); nextQ(); }
});

render();
})();
</script>

</body>
</html>
